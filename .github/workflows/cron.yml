name: cron

# Manual runs of nemira.app's /api/cron/* endpoints, for testing or a one-off
# re-run.
#
# The schedules moved inside the app on 2026-11-05 (src/lib/cron/schedule.ts in
# the app repo). GitHub's scheduler fired about 13 runs a day against ~315
# expected and ran daily jobs 7 to 8 hours late.
#
# DO NOT add a schedule here. clinic-daily-summary and clinic-weekly-summary have
# no dedup of their own, so a second scheduler emails clinics twice.
#
# Endpoints are bearer-token protected (constant-time compare server-side).
# CRON_SECRET lives as a repo secret here and as a Fly secret on the app.
# PUBLIC-REPO LOG RULE: never print response bodies, status codes only.

on:
  workflow_dispatch:
    inputs:
      handler:
        description: "Which cron endpoint to fire (manual run)"
        required: true
        type: choice
        options:
          - booking-reminders-24h
          - booking-reminders-1h
          - clinic-daily-summary
          - clinic-weekly-summary
          - lead-unread-nudge
          - quickbooks-reconcile
          - purge-login-attempts
          - transcription-finalize
          - usage-alerts
          - recall-nudges
          - membership-benefit-reminders
          - review-requests
          - deposit-abandon-sweep
          - calendar-sync-retry
          - sessions-sweep
          - trial-reminders
          - seat-billing-sync
          - sms-reminders

env:
  APP_URL: ${{ vars.APP_URL || 'https://nemira.app' }}

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Fire endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HANDLER: ${{ inputs.handler }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set as a repo secret. Aborting."
            exit 1
          fi

          # Public repo: log status only, NEVER the response body.
          http_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/${HANDLER}" || true)
          echo "${HANDLER}: ${http_status}"
          case "$http_status" in
            2*|3*) ;;
            *) exit 1 ;;
          esac
