name: keepalive

# GitHub disables scheduled workflows in repos with no commit activity for
# 60 days. This monthly empty commit keeps the cron schedules alive forever.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: prevent 60-day scheduled-workflow auto-disable"
          git push
